services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gmaps
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: gmaps
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  scraper-web:
    image: gosom/google-maps-scraper:latest
    depends_on:
      - db
    ports:
      - "58080:58080"
    volumes:
      - playwright-cache:/opt
      - ./webdata:/webdata
    command: -web -addr :58080 -data-folder /webdata
    restart: unless-stopped

volumes:
  pgdata:
  playwright-cache:
